<!DOCTYPE html>
<html lang="en">
  <head>
    <title>MIDI Input</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/13.8.6/Tone.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="./main.js" type="module"></script>
  </head>
  <body>
    <nav class="status-bar" id="connection-status-bar" aria-label="Connection status">
      <div class="status" id="server-status" role="status">Server:<strong>Disconnected</strong></div>
      <div class="status" id="midi-status" role="status">MIDI:<strong>Disconnected</strong></div>
      <ul class="device-list" id="midi-devices"></ul>
    </nav>
    <div class="testBars"> 
      <div class="testBar">0</div>
      <div class="testBar">1</div>
      <div class="testBar">2</div>
      <div class="testBar">3</div>
    </div>
    <div class="bars">
      <div class="bar"></div>
      <div class="bar"> </div>
      <div class="bar"> </div>
      <div class="bar"> </div>
      <div class="bar"></div>
      <div class="bar"> </div>
      <div class="bar"> </div>
      <div class="bar"> </div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
  </body>
</html>
